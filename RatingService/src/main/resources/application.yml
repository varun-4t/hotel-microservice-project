server:
  port: 8083

spring:
  application:
    name: RATING-SERVICE
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-2021577.okta.com/oauth2/default

logging:
  level:
    org.springframework.data.mongodb: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch_registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka