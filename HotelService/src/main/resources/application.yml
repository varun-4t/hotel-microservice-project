server:
  port: 8082

spring:
  application:
    name: HOTEL-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/microservice
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://integrator-2021577.okta.com/oauth2/default

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch_registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
