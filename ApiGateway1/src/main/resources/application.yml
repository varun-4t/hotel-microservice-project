spring:
  application:
    name: API-GATEWAY1
  cloud:
    gateway:

      routes:
        - id: USERSERVICE
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**

        - id: HOTELSERVICE
          uri: lb://HOTELSERVICE
          predicates:
            - Path=/hotels/**

        - id: RATINGSERVICE
          uri: lb://RATINGSERVICE
          predicates:
            - Path=/ratings/**

  security:
    oauth2:

      client:
        registration:
          okta:
            client-id: ${OKTA_CLIENT_ID}
            client-secret: ${OKTA_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - offline_access
            provider: okta

        provider:
          okta:
            issuer-uri: https://integrator-2021577.okta.com/oauth2/default

      resourceserver:
        jwt:
          issuer-uri: https://integrator-2021577.okta.com/oauth2/default

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch_registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"
